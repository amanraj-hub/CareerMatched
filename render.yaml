
# Render Blueprint: TalentLoop AI

services:
  - type: web
    name: talentloop-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: >-
      pip install --no-cache-dir -r backend/requirements.txt psycopg2-binary==2.9.10 &&
      cd frontend && npm ci && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: talentloop-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /opt/render/project/src/backend/uploads

databases:
  - name: talentloop-db
    databaseName: talentloop
    user: talentloop_user
    region: oregon
    plan: basic-free
